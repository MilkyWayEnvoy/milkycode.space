<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilkyCode · Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;1,7..72,300&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   COLOUR SYSTEM — Intermediate: warm mid-tone board
   Neither the washed-out cream nor the void black.
   Think aged vellum in amber lamplight.
═══════════════════════════════════════════════════════ */
:root {
  /* Board surface — semi-dark */
  --bg:        #1a1f2e;
  --panel:     #1e2436;
  --panel-h:   #242b40;
  --panel-hdr: #1a2030;

  /* Typography — light on dark */
  --ink:       #d8dde8;
  --ink-2:     #b8c2d0;
  --ink-3:     #7a8898;
  --ink-4:     #4a5668;

  /* Grid lines */
  --grid:      rgba(255,255,255,0.06);
  --grid-2:    rgba(255,255,255,0.1);

  /* Status symbols */
  --chk-yes:   #4aaa78;
  --chk-pend:  #c8921a;
  --chk-open:  #6a8898;
  --chk-new:   #c87840;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: #141824;
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  line-height: 1.55;
  min-height: 100vh;
}

/* Subtle paper texture via repeating gradient */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events: none; z-index: 0;
}

.page { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding-bottom: 4rem; }

/* ═══════════════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════════════ */
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 2rem; height: 52px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(18,22,34,0.97);
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(10px);
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.ep-logo-sm { width: 30px; height: 30px; object-fit: contain; opacity: 0.92; }
.site-name {
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: #c8a84a;
}
.nav-links { display: flex; gap: 0; align-items: center; }
.nav-link {
  font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
  color: #7a8898; text-decoration: none; padding: 0 0.85rem;
  height: 52px; display: flex; align-items: center;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.nav-link:hover { color: #c8d8e8; }
.nav-link.active { color: #e8c96a; border-bottom-color: #e8c96a; }
.nav-right { display: flex; align-items: center; gap: 0.75rem; }
.test-badge {
  font-size: 9px; color: #5a4a88;
  background: rgba(90,74,136,0.1); border: 0.5px solid rgba(90,74,136,0.28);
  border-radius: 3px; padding: 2px 8px; letter-spacing: 0.05em;
}
.lang-toggle { display: flex; border: 0.5px solid var(--grid-2); border-radius: 3px; overflow: hidden; }
.lang-btn {
  background: none; border: none; padding: 4px 10px;
  font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em; cursor: pointer; color: var(--ink-3); transition: all 0.15s;
}
.lang-btn.active { background: rgba(200,168,74,0.12); color: #e8c96a; }

/* ═══════════════════════════════════════════════════════
   HEADER — Deep space Earth photo, title + logo
═══════════════════════════════════════════════════════ */
.gc-header {
  position: relative; overflow: hidden;
  /* Photo: Earth with city lights, stars left, planet right */
  background:
    linear-gradient(180deg,
      rgba(2,4,10,0.08) 0%,
      rgba(2,4,10,0.22) 45%,
      rgba(2,4,10,0.78) 82%,
      rgba(2,4,10,0.96) 100%),
    
  min-height: 310px;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 6rem 2.5rem 0;
}

/* Vignette on left edge so title text always readable */
.gc-header::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    rgba(2,4,10,0.55) 0%,
    rgba(2,4,10,0.2) 40%,
    transparent 70%);
  pointer-events: none;
}

/* Title row */
.gc-title-row {
  position: relative; z-index: 2;
  display: flex; align-items: flex-end;
  justify-content: space-between; gap: 2rem; flex-wrap: wrap;
}

/* Title + logo wrapper */
.gc-title-block {
  display: inline-flex;
  align-items: center;     /* vertically centre logo to cap-height */
  gap: 0.13em;
  line-height: 1;
  flex-shrink: 0;          /* never let the subtitle block squeeze this — was causing the clipped "l" */
  white-space: nowrap;
  max-width: 100%;
  /* Must match .gc-title's font-size: the logo's "em" sizing below resolves
     against THIS element's font-size (inherited by the img), not the
     title span's. Without this, the logo inherited the page's base
     font-size instead of the title's, rendering tiny and forcing
     align-items:center to center it against the tall title line-box —
     which is why it floated above the letters instead of sitting with them. */
  font-size: clamp(3rem, 6.5vw, 6.5rem);
}
body.lang-ru .gc-title-block {
  font-size: clamp(2.4rem, 5vw, 5.2rem);
}

.gc-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(3rem, 6.5vw, 6.5rem);
  font-weight: 400; font-style: italic;
  line-height: 0.95; letter-spacing: 0;
  min-width: 0;
  overflow-wrap: normal;
  background: linear-gradient(135deg,
    #fff8e8 0%,
    #f5d870 15%,
    #e8c858 32%,
    #d4b048 48%,
    #c8d8e8 70%,
    #f0f6ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  /* text-shadow looked like the safe choice (no filter-tiling risk) but it
     visibly muddied the gradient fill itself — the shadow was bleeding
     through the transparent-fill glyph mask instead of staying behind it.
     Back to filter:drop-shadow (confirmed clean, bright fill colour), with
     explicit single-layer compositing hints so the GPU can't tile-rasterize
     it and reintroduce the split-glyph seam. Offset bumped +2px and blur
     opened slightly per request. */
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.75));
  transform: translateZ(0);
  will-change: filter;
  backface-visibility: hidden;
  isolation: isolate;
}
body.lang-ru .gc-title {
  font-size: clamp(2.4rem, 5vw, 5.2rem);
}

/* Logo: height = 1em of the title = same as cap-height
   margin-bottom nudges flower-curve baseline to letter descender */
.gc-title-logo {
  /* Scaled up from 0.72em (then 0.95em): the wreath artwork sits inside a
     square canvas with real padding, most of it at the bottom — the gold
     wreath border doesn't reach the canvas edges evenly. Sizing the box to
     cap-height only got the BOX to the guide lines, not the wreath itself.
     This factor pushes the box further past the lines so the wreath's own
     edges — not the canvas edges — land on them. The slight downward shift
     compensates for the extra padding being on the bottom side. Both values
     are a visual estimate — nudge further if it's not quite sitting right. */
  height: 1.06em;
  width: 1.06em;
  transform: translateY(3%);
  object-fit: contain;
  object-position: center;
  display: block;
  flex-shrink: 0;
  margin-bottom: 0;
  border-radius: 0;
  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,0.475));
}

.gc-subtitle-block {
  text-align: right; position: relative; z-index: 2;
}
.gc-subtitle {
  font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(170,200,220,0.75); line-height: 1.9;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}
.gc-live {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(120,210,170,0.85);
}
.gc-live::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: rgba(120,210,170,0.85);
  animation: pulse 2s ease-in-out infinite;
}

/* Meta strip inside header — bottom */
.gc-meta {
  position: relative; z-index: 2;
  display: flex; gap: 0; flex-wrap: wrap;
  padding: 0.7rem 0;
  border-top: 0.5px solid rgba(160,188,210,0.2);
  margin-top: 1.5rem;
}
.gc-meta-item {
  font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(160,188,210,0.65);
  padding: 0 1.25rem; border-right: 0.5px solid rgba(160,188,210,0.15);
}
.gc-meta-item:first-child { padding-left: 0; }
.gc-meta-item:last-child { border-right: none; margin-left: auto; }
.gc-meta-item span { color: rgba(185,210,228,0.9); }
.gc-clock { color: rgba(185,210,228,0.9); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }

/* ══ NEWS FROM ENVOY ══ */
.news-envoy-block {
  background: rgba(255,255,255,0.015);
}
.news-envoy-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 200px;
}
@media(max-width: 700px) { .news-envoy-inner { grid-template-columns: 1fr; } }
.news-envoy-text {
  display: flex;
  flex-direction: column;
  padding: 1.5rem 1.75rem;
  border-right: 0.5px solid rgba(200,168,74,0.12);
}
.news-envoy-date {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  font-style: italic;
  color: rgba(200,168,74,0.65);
  letter-spacing: 0.04em;
  margin: 0.75rem 0 0.5rem;
}
.news-envoy-body {
  flex: 1;
  padding: 0.25rem 0;
}
.news-item {
  font-size: 13px;
  color: #b8c2d0;
  line-height: 1.9;
  letter-spacing: 0.01em;
}
.news-comment {
  margin-top: 0.85rem;
  padding: 0.8rem 0.9rem;
  background: rgba(200,168,74,0.05);
  border-left: 2px solid rgba(200,168,74,0.35);
  border-radius: 0 6px 6px 0;
}
.news-comment-label {
  font-family: 'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(200,168,74,0.7);
  margin-bottom: 0.4rem;
}
.news-comment-quote {
  font-size: 12px;
  font-style: italic;
  color: #8a94a4;
  line-height: 1.6;
  margin-bottom: 0.55rem;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  padding-bottom: 0.55rem;
}
.news-comment-text {
  font-size: 12.5px;
  color: #c8d0dc;
  line-height: 1.65;
}
.news-envoy-img-wrap {
  overflow: hidden;
}
.news-envoy-img {
  width: 100%;
  height: 100%;
  min-height: 180px;
  object-fit: cover;
  object-position: center;
  display: block;
}

/* ═══════════════════════════════════════════════════════
   BOARD — Two-column grid of blocks
═══════════════════════════════════════════════════════ */
.board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--grid);
  border: 1px solid var(--grid);
  margin: 0 2rem;
}
@media(max-width:680px){ .board { grid-template-columns: 1fr; margin: 0 1rem; } }

/* Block */
.block {
  background: var(--panel);
  display: flex; flex-direction: column;
  transition: background 0.18s;
}
.block:hover { background: var(--panel-h); }
.block.clickable { cursor: pointer; }

/* Block header */
.block-hdr {
  display: flex; align-items: center; justify-content: space-between;
  gap: 0.5rem;
  padding: 0.6rem 1rem;
  background: var(--panel-hdr);
  border-bottom: 0.5px solid var(--grid);
}
.block-cat {
  font-size: 13px; font-weight: 500; letter-spacing: 0.09em;
  text-transform: uppercase; color: #d6c7a3;
}
.block.clickable:hover .block-cat { color: #e8dcc0; }

.block-sub {
  font-size: 9px; letter-spacing: 0.07em;
  color: var(--ink-4); white-space: nowrap;
}
.block-arrow {
  font-size: 11px; color: #4a5668; margin-left: auto;
  transition: transform 0.18s, color 0.18s;
}
.block.clickable:hover .block-arrow { transform: translateX(4px); color: #e8dcc0; }

/* Rows */
.block-rows { flex: 1; }
.block-row {
  display: grid;
  grid-template-columns: 88px 1fr 18px;
  gap: 0 0.6rem;
  padding: 0.42rem 1rem;
  border-bottom: 0.5px solid rgba(255,255,255,0.05);
  align-items: baseline;
  transition: background 0.1s;
}
.block-row:last-child { border-bottom: none; }
.block-row:hover { background: rgba(255,255,255,0.04); }

.row-code {
  font-size: 10.5px; font-weight: 500; color: #e8c96a;
  letter-spacing: 0.04em; white-space: nowrap;
}
.row-desc {
  font-size: 11.5px; color: #b8c2d0;
  font-family: 'Literata', Georgia, serif;
  font-style: italic; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  line-height: 1.35;
}
.row-chk { font-size: 13px; text-align: right; line-height: 1; }
.chk-yes  { color: var(--chk-yes); }
.chk-pend { color: var(--chk-pend); }
.chk-open { color: var(--chk-open); }
.chk-new  { color: var(--chk-new); }

/* Block footer */
.block-ftr {
  padding: 0.38rem 1rem;
  border-top: 0.5px solid rgba(255,255,255,0.07);
  background: rgba(0,0,0,0.2);
  font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: #4a5668;
  display: flex; justify-content: space-between;
}

/* Full-width block */
.block.full { grid-column: 1 / -1; }
.block.full .block-rows {
  display: grid; grid-template-columns: 1fr 1fr;
}
@media(max-width:680px){
  .block.full .block-rows { grid-template-columns: 1fr; }
}

/* Divider band */
.board-divider {
  grid-column: 1 / -1;
  background: rgba(200,168,74,0.05);
  border-top: 0.5px solid rgba(200,168,74,0.15);
  border-bottom: 0.5px solid rgba(200,168,74,0.15);
  padding: 0.35rem 1rem;
  font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: #c8a84a;
}

/* Bulletin block — slight amber glow */
.block.bulletin { border: 0.5px solid rgba(200,168,74,0.25); }
.block.bulletin .block-hdr { background: rgba(200,168,74,0.07); }

/* ═══════════════════════════════════════════════════════
   PAGE FOOTER
═══════════════════════════════════════════════════════ */
.page-footer {
  margin: 1.5rem 2rem 0;
  padding-top: 1rem;
  border-top: 0.5px solid var(--grid);
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
}
.footer-l { font-size: 10px; color: #4a5668; line-height: 1.9; }
.footer-l strong { color: #7a8898; }
.footer-r { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #4a5668; text-align: right; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ═══════════════════════════════════════════════════════
   ACCOUNT — Coming Soon placeholder
═══════════════════════════════════════════════════════ */

  position: relative;
  border-radius: 18px;
  overflow: hidden;
  margin: 2rem 0;
